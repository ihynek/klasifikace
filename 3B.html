<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení - Třída 3B</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .login-box { max-width: 400px; margin: 0 auto; }
        .login-box.hidden { display: none; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        .search-input, .pin-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .search-input:focus, .pin-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .pin-input { letter-spacing: 5px; text-align: center; font-weight: bold; }
        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
        .error-message.show { display: block; animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .results { display: none; }
        .results.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .student-name { font-size: 1.8em; color: #333; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #667eea; }
        .grade-section { margin-bottom: 25px; }
        .section-title { font-size: 1.3em; color: #667eea; margin-bottom: 12px; font-weight: 600; }
        .grades-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; }
        .grade-item { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; border: 2px solid #e9ecef; }
        .grade-label { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .grade-value { font-size: 1.4em; font-weight: bold; color: #333; }
        .grade-value.empty { color: #ccc; }
        .summary-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .summary-item { text-align: center; }
        .summary-label { font-size: 0.9em; opacity: 0.9; margin-bottom: 8px; }
        .summary-value { font-size: 2em; font-weight: bold; }
        .pl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pl-item { background: #f8f9fa; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #e9ecef; }
        .pl-label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .pl-value { font-size: 1.2em; font-weight: bold; color: #333; }
        .pl-value.high { color: #28a745; }
        .pl-value.medium { color: #ffc107; }
        .pl-value.low { color: #dc3545; }
        .btn-logout { margin-top: 20px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: #5a6268; }
    </style>
</head>

    <div class="container">
        <h1>🔐 Hodnocení</h1>
        <div class="subtitle">Třída 3B - Biologie</div>
        
        <div class="login-box" id="loginBox">
            <div class="input-group">
                <label class="input-label">Zadej své příjmení:</label>
                <input type="text" class="search-input" id="searchInput" placeholder="např. Novák" autocomplete="off">
            </div>
            <div class="input-group">

                <input type="password" class="pin-input" id="pinInput" placeholder="• • • •" maxlength="4" autocomplete="off">

            <button class="btn-verify" id="btnVerify">Zobrazit hodnocení</button>
            <div class="error-message" id="errorMessage">❌ Špatné příjmení nebo PIN!</div>
            
            <div style="text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                <a href="index.html" style="color: #667eea; text-decoration: none; font-size: 0.95em;">
                    ← Zpět na výběr třídy
                </a>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="student-name" id="studentName"></div>
            <div class="grade-section">

            <div class="grade-section">

            <div class="grade-section">

            <div class="summary-box">

                    <div class="summary-value" id="weightedAvg">-</div>

                <div class="summary-item">

                </div>
                <div class="summary-item">

                </div>
                <div class="summary-item">

                    <div class="summary-value" id="grade">-</div>
                </div>
            </div>
            <button class="btn-logout" id="btnLogout">← Odhlásit se</button>
        </div>
    </div>

            const empty = !value ? ' empty' : '';
            return `<div class="grade-item">
                <div class="grade-label">${label}</div>
                <div class="grade-value${empty}">${value || '—'}</div>
            </div>`;
        }

        function plItem(label, value) {
            let cls = '';
            if (value) {
                const n = parseFloat(value);
                cls = n >= 90 ? ' high' : n >= 75 ? ' medium' : ' low';
            }
            return `<div class="pl-item">
                <div class="pl-label">${label}</div>
                <div class="pl-value${cls}">${value ? value + ' %' : '—'}</div>
            </div>`;
        }

        function displayStudent(s) {
            document.getElementById('studentName').textContent = s.name;

            // VT
            let vtHtml = '';
            for (let i = 1; i <= 5; i++) vtHtml += gradeItem(`VT${i}`, s[`VT${i}`]);
            document.getElementById('vtGrades').innerHTML = vtHtml;

            // MT
            let mtHtml = '';
            for (let i = 1; i <= 5; i++) mtHtml += gradeItem(`MT${i}`, s[`MT${i}`]);
            document.getElementById('mtGrades').innerHTML = mtHtml;

            // LP
            document.getElementById('lpGrade').innerHTML = gradeItem('LP', s.LP);

            // PL
            let plHtml = '';
            for (let i = 1; i <= 8; i++) plHtml += plItem(`PL${i}`, s[`PL${i}`]);
            document.getElementById('plGrades').innerHTML = plHtml;

            // Souhrn
            document.getElementById('weightedAvg').textContent = s.vazeny  || '—';
            document.getElementById('finalAvg').textContent    = s.final   || '—';
            document.getElementById('bonusVal').textContent    = s.bonus   ? (parseFloat(s.bonus) < 0 ? s.bonus : (s.bonus === '0' ? '0' : '-' + s.bonus)) : '—';
            document.getElementById('grade').textContent       = s.znamka  || '—';
        }
    </script>
</body>
</html>
