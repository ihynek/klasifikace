<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení - 6SA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto 30px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .summary-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .summary-item {
            display: inline-block;
            margin-right: 40px;
            margin-bottom: 20px;
        }
        
        .summary-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .pl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .pl-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .pl-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .pl-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .pl-value.high { color: #28a745; }
        .pl-value.medium { color: #ffc107; }
        .pl-value.low { color: #dc3545; }
        .pl-value.podvod { color: #fff; background: #ff0000; padding: 3px 8px; border-radius: 4px; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .btn-logout {
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-logout:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Hodnocení</h1>
        <div style="text-align: center; color: #666; margin-bottom: 30px;">Třída 6SA</div>
        
        <div class="login-box" id="loginBox">
            <div style="margin-bottom: 20px;">
                <input type="text" id="name" placeholder="Příjmení">
                <input type="password" id="pin" placeholder="PIN">
                <button onclick="login()">Přihlásit se</button>
            </div>
        </div>
        
        <div id="studentView" style="display: none;">
            <h2 id="studentName" style="color: #667eea; margin-bottom: 20px;"></h2>
            
            <div class="summary-section">
                <div class="summary-item">
                    <div class="summary-label">Vážený průměr</div>
                    <div class="summary-value" id="vazeny">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Finální průměr</div>
                    <div class="summary-value" id="finalni">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Známka</div>
                    <div class="summary-value" id="znamka">—</div>
                </div>
            </div>
            
            <h3 style="color: #667eea; margin-bottom: 15px;">📋 Praktické listy (PL)</h3>
            <div class="pl-grid" id="plGrid"></div>
            
            <button class="btn-logout" onclick="logout()">← Odhlásit se</button>
        </div>
    </div>

    <script>
        const csvData = `Poř. č.,Příjmení,VT1,VT2,VT3,VT4,VT5,VT6 ,MT1,MT2,MT3,MT4,ST,MT ,LP,Vážený průměr,PL1 (%),PL2 (%),PL3 (%),PL4 (%),PL5 (%),PL6 (%),PL7 (%),PL8 (%),Počet PL,% PL,Průměr bonusů,Bonus 75%+,Celkový bonus,Finální průměr,ZNÁMKA,email,PIN,Zadaných PL,PODVOD (zadej slovem),Podvod (nálepka)

2,Jan Bartek,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,jan_bartek@student.gymberoun.cz,8528,,,
3,Ondřej Bielčik,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,ondrej_bielcik@student.gymberoun.cz,8453,,,
4,Barbora Bohátková,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,barbora_bohatkova@student.gymberoun.cz,3863,,,

6,Kateřina Brodecká,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,katerina_brodecka@student.gymberoun.cz,6730,,,

8,Albert Jeránek,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,albert_jeranek@student.gymberoun.cz,9304,,,
9,Tobiáš Kaplan,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,tobias_kaplan@student.gymberoun.cz,2801,,,
10,Karolína Keprtová,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,karolina_keprtova@student.gymberoun.cz,9731,,,
11,Jáchym Kolman,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,jachym_kolman@student.gymberoun.cz,2987,,,
12,Lukáš Konvalinka,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,lukas_konvalinka@student.gymberoun.cz,2313,,,
13,Jakub Máca,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,jakub_maca@student.gymberoun.cz,8470,,,
14,Barbora Meszárošová,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,barbora_meszarosova@student.gymberoun.cz,5315,,,

18,Jan Rúta,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,jan_ruta@student.gymberoun.cz,4763,,,
19,Dominik Svatoš,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,dominik_svatos@student.gymberoun.cz,6069,,,
20,Kryštof Svoboda,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,krystof_svoboda@student.gymberoun.cz,4340,,,
21,Adéla Silhava,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,adela_silhava@student.gymberoun.cz,3923,,,
22,Václav Šopík,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,vaclav_sopik@student.gymberoun.cz,3307,,,
23,Lukáš Tóth,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,lukas_toth@student.gymberoun.cz,4089,,,
24,Daniela Turková,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,daniela_turkova@student.gymberoun.cz,6685,,,
25,Barbora Vaňková,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,barbora_vankova@student.gymberoun.cz,7063,,,
26,Štěpánka Voldánová,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,stepanka_voldanova@student.gymberoun.cz,7712,,,
27,Anna Vrbská,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,anna_vrbska@student.gymberoun.cz,4454,,,
28,Robert Zoch,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,robert_zoch@student.gymberoun.cz,7603,,,
,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,LEGENDA A PRAVIDLA:,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,Pokud student neudělal žádné PL:,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Celkový bonus = 0,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Finální průměr = Vážený průměr (bez bonusů),,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Známka se normálně vypočítá,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,Bonusy z praktických listů (hodnotí se jen aktuálně zadané PL):,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• 90-100%: -0.25,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• 75-89%: -0.15,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• 60-74%: -0.1,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Výsledky 0 % se nepočítají jako odevzdaná práce,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,Bonus za konzistenci (platí od 3. odevzdané práce):,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Odevzdáš ≥75 % zadaných PL → extra -0.15,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,Penalizace za opisování (PODVOD):,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• Do buňky PL napiš: P (= podvod),,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,"• Platí pro opisujícího I pro toho, kdo práci poskytl",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,"• Do PL buňky napiš ""P"" = podvod → zobrazuje se jako nálepka, bez dopadu na průměr (do příštího roku)",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,"• Příklad: 2× P = -0.4, 3× P = -0.6, 4× P = -0.8, 5× P = -1.0",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• P se počítá jako odevzdaná práce (vstupuje do jmenovatele konzistenčního bonusu),,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
,• P nedává žádný bonus (0 % = žádný příspěvek k průměru bonusů),,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,
`;
        const pinsMapping = {"julie andielová": "3386", "jan bartek": "8528", "ondřej bielčik": "8453", "barbora bohátková": "3863", "aleksander bořil": "7439", "kateřina brodecká": "6730", "olívie janušková": "8102", "albert jeránek": "9304", "tobiáš kaplan": "2801", "karolína keprtová": "9731", "jáchym kolman": "2987", "lukáš konvalinka": "2313", "jakub máca": "8470", "barbora meszárošová": "5315", "jarmila mutlová": "1784", "michal polovinčák": "4350", "marie povolná": "6494", "jan rúta": "4763", "dominik svatoš": "6069", "kryštof svoboda": "4340", "adéla silhava": "3923", "václav šopík": "3307", "lukáš tóth": "4089", "daniela turková": "6685", "barbora vaňková": "7063", "štěpánka voldánová": "7712", "anna vrbská": "4454", "robert zoch": "7603"};
        
        function login() {
            const name = document.getElementById('name').value.toLowerCase().trim();
            const pin = document.getElementById('pin').value;
            
            if (!pinsMapping[name] || pinsMapping[name] !== pin) {
                alert('Nesprávné příjmení nebo PIN');
                return;
            }
            
            const lines = csvData.split('\n');
            const headers = lines[0].split(',');
            
            let student = null;
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                let studentObj = {};
                for (let j = 0; j < headers.length; j++) {
                    studentObj[headers[j].trim()] = values[j] ? values[j].trim() : '';
                }
                if (studentObj['Příjmení'] && studentObj['Příjmení'].toLowerCase() === name) {
                    student = studentObj;
                    break;
                }
            }
            
            if (student) {
                displayStudent(student);
            }
        }
        
        function displayStudent(student) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('studentView').style.display = 'block';
            
            document.getElementById('studentName').textContent = student['Příjmení'] || '—';
            
            const vazeny = student['Vážený průměr'] || '—';
            const finalni = student['Finální průměr'] || '—';
            const znamka = student['ZNÁMKA'] || student['Známka'] || '—';
            
            document.getElementById('vazeny').textContent = vazeny;
            document.getElementById('finalni').textContent = finalni ? parseFloat(finalni.replace(',', '.')).toFixed(2) : '—';
            document.getElementById('znamka').textContent = znamka;
            
            let plHtml = '';
            for (let i = 1; i <= 8; i++) {
                const plKey = 'PL' + i + ' (%)';
                const value = student[plKey] || '—';
                
                let displayValue = value;
                let colorClass = '';
                
                if (value.toString().trim().toUpperCase() === 'P') {
                    colorClass = 'podvod';
                    displayValue = '⚠️ P';
                } else if (value !== '—') {
                    const numValue = parseFloat(value.replace(',', '.'));
                    if (numValue >= 90) colorClass = 'high';
                    else if (numValue >= 60) colorClass = 'medium';
                    else if (numValue > 0) colorClass = 'low';
                    displayValue = value + '%';
                }
                
                plHtml += `<div class="pl-item"><div class="pl-label">PL${i}</div><div class="pl-value ${colorClass}">${displayValue}</div></div>`;
            }
            
            document.getElementById('plGrid').innerHTML = plHtml;
        }
        
        function logout() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('studentView').style.display = 'none';
            document.getElementById('name').value = '';
            document.getElementById('pin').value = '';
        }
        
        document.getElementById('pin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
