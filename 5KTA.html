<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení - Třída 5KTA (Kvinta)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .login-box { max-width: 400px; margin: 0 auto; }
        .login-box.hidden { display: none; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        .search-input, .pin-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .search-input:focus, .pin-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .pin-input { letter-spacing: 5px; text-align: center; font-weight: bold; }
        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
        .error-message.show { display: block; animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .results { display: none; }
        .results.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .student-name { font-size: 1.8em; color: #333; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #667eea; }
        .grade-section { margin-bottom: 25px; }
        .section-title { font-size: 1.3em; color: #667eea; margin-bottom: 12px; font-weight: 600; }
        .grades-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; }
        .grade-item { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; border: 2px solid #e9ecef; }
        .grade-label { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .grade-value { font-size: 1.4em; font-weight: bold; color: #333; }
        .grade-value.empty { color: #ccc; }
        .summary-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .summary-item { text-align: center; }
        .summary-label { font-size: 0.9em; opacity: 0.9; margin-bottom: 8px; }
        .summary-value { font-size: 2em; font-weight: bold; }
        .pl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pl-item { background: #f8f9fa; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #e9ecef; }
        .pl-label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .pl-value { font-size: 1.2em; font-weight: bold; color: #333; }
        .pl-value.high { color: #28a745; }
        .pl-value.medium { color: #ffc107; }
        .pl-value.low { color: #dc3545; }
        .btn-logout { margin-top: 20px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Hodnocení</h1>
        <div class="subtitle">Třída 5KTA (Kvinta) - Biologie</div>
        
        <div class="login-box" id="loginBox">
            <div class="input-group">
                <label class="input-label">Zadej své příjmení:</label>
                <input type="text" class="search-input" id="searchInput" placeholder="např. Novák" autocomplete="off">
            </div>
            <div class="input-group">
                <label class="input-label">Zadej svůj PIN:</label>
                <input type="password" class="pin-input" id="pinInput" placeholder="• • • •" maxlength="4" autocomplete="off">
            </div>
            <button class="btn-verify" id="btnVerify">Zobrazit hodnocení</button>
            <div class="error-message" id="errorMessage">❌ Špatné příjmení nebo PIN!</div>
            
            <div style="text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                <a href="index.html" style="color: #667eea; text-decoration: none; font-size: 0.95em; transition: color 0.3s;">
                    ← Zpět na výběr třídy

            </div>
        </div>
        
        <div class="results" id="results">

            <div class="grade-section">

            </div>
            <div class="grade-section">

                <div class="grades-grid" id="mtGrades"></div>
            </div>
            <div class="grade-section">
                <div class="section-title">🔬 Laboratorní práce (LP)</div>
                <div class="grades-grid" id="lpGrade"></div>
            </div>
            <div class="grade-section">
                <div class="section-title">📋 Praktické listy (PL)</div>
                <div class="pl-grid" id="plGrades"></div>
            </div>
            <div class="summary-box">
                <div class="summary-item">
                    <div class="summary-label">Vážený průměr</div>
                    <div class="summary-value" id="weightedAvg">-</div>
                </div>
                <div class="summary-item">

                </div>
                <div class="summary-item">
                    <div class="summary-label">Známka</div>
                    <div class="summary-value" id="grade">-</div>

            </div>
            <button class="btn-logout" id="btnLogout">← Odhlásit se</button>

        const pinsMapping = {"julie andielová": "3386", "jan bartek": "8528", "ondřej bielčik": "8453", "barbora bohátková": "3863", "aleksander bořil": "7439", "kateřina brodecká": "6730", "olívie janušková": "8102", "albert jeránek": "9304", "tobiáš kaplan": "2801", "karolína keprtová": "9731", "jáchym kolman": "2987", "lukáš konvalinka": "2313", "jakub máca": "8470", "barbora meszárošová": "5315", "jarmila mutlová": "1784", "michal polovinčák": "4350", "marie povolná": "6494", "jan rúta": "4763", "dominik svatoš": "6069", "kryštof svoboda": "4340", "adéla silhava": "3923", "václav šopík": "3307", "lukáš tóth": "4089", "daniela turková": "6685", "barbora vaňková": "7063", "štěpánka voldánová": "7712", "anna vrbská": "4454", "robert zoch": "7603", "• celkový bonus = 0": "8554", "• finální průměr = vážený průměr (bez bonusů)": "5518"};
        
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const students = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length > 1) {
                    const student = {};
                    headers.forEach((header, index) => {
                        student[header] = values[index] ? values[index].trim() : '';
                    });
                    students.push(student);
                }
            }
            return students;
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }
        
        const students = parseCSV(csvData);
        const searchInput = document.getElementById('searchInput');
        const pinInput = document.getElementById('pinInput');
        const btnVerify = document.getElementById('btnVerify');
        const errorMessage = document.getElementById('errorMessage');
        const loginBox = document.getElementById('loginBox');
        const results = document.getElementById('results');
        const btnLogout = document.getElementById('btnLogout');
        
        pinInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') btnVerify.click();
        });
        
        btnVerify.addEventListener('click', function() {
            const prijmeni = searchInput.value.trim().toLowerCase();
            const pin = pinInput.value.trim();
            errorMessage.classList.remove('show');
            
            if (!prijmeni || !pin) {
                showError();
                return;
            }
            
            const found = students.find(s => {
                const nameFields = ['Jméno a Příjmení', 'Příjmení', 'Jméno Příjmení'];
                for (let field of nameFields) {
                    const name = (s[field] || '').toLowerCase();
                    if (name.includes(prijmeni)) return true;
                }
                return false;
            });
            
            if (!found) {
                showError();
                return;
            }
            
            let fullName = '';
            const nameFields = ['Jméno a Příjmení', 'Příjmení', 'Jméno Příjmení'];
            for (let field of nameFields) {
                if (found[field]) {
                    fullName = found[field];
                    break;
                }
            }
            
            const correctPin = pinsMapping[fullName.toLowerCase()];
            if (pin !== correctPin) {
                showError();
                return;
            }
            
            displayStudent(found, fullName);
            loginBox.classList.add('hidden');
            results.classList.add('show');
        });
        
        btnLogout.addEventListener('click', function() {
            results.classList.remove('show');
            loginBox.classList.remove('hidden');
            searchInput.value = '';
            pinInput.value = '';
            errorMessage.classList.remove('show');
        });
        
        function showError() {
            errorMessage.classList.add('show');
            pinInput.value = '';
            pinInput.focus();
        }
        
        function displayStudent(student, fullName) {
            document.getElementById('studentName').textContent = fullName;
            
            // Velké testy
            const vtContainer = document.getElementById('vtGrades');
            vtContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const value = student[`VT${i}`];
                vtContainer.innerHTML += `<div class="grade-item"><div class="grade-label">VT${i}</div><div class="grade-value ${value ? '' : 'empty'}">${value || '—'}</div></div>`;
            }
            
            // Malé testy
            const mtContainer = document.getElementById('mtGrades');
            mtContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const value = student[`MT${i}`];
                mtContainer.innerHTML += `<div class="grade-item"><div class="grade-label">MT${i}</div><div class="grade-value ${value ? '' : 'empty'}">${value || '—'}</div></div>`;
            }
            
            // Laboratorní práce
            const lpContainer = document.getElementById('lpGrade');
            lpContainer.innerHTML = '';
            const lpValue = student['LP'];
            lpContainer.innerHTML += `<div class="grade-item"><div class="grade-label">LP</div><div class="grade-value ${lpValue ? '' : 'empty'}">${lpValue || '—'}</div></div>`;
            
            // Praktické listy
            const plContainer = document.getElementById('plGrades');
            plContainer.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                // Zkusíme různé formáty názvů sloupců
                let value = student[`PL${i} (%)`] || student[`PL${i}\n(%)`] || student[`PL${i}`];
                let colorClass = '';
                if (value) {
                    const numValue = parseFloat(value.replace(',', '.'));
                    if (numValue >= 90) colorClass = 'high';
                    else if (numValue >= 60) colorClass = 'medium';
                    else if (numValue > 0) colorClass = 'low';
                }
                plContainer.innerHTML += `<div class="pl-item"><div class="pl-label">PL${i}</div><div class="pl-value ${colorClass}">${value ? value + '%' : '—'}</div></div>`;
            }
            
            // Souhrn - OPRAVENO pro české názvy sloupců
            const vazenyPrumer = student['Vážený průměr'] || student['Vážený\nprůměr'] || '';
            const finalniPrumer = student['Finální průměr'] || student['Finální\nprůměr'] || '';
            const znamka = student['ZNÁMKA'] || student['Známka'] || '';
            
            // Zaokrouhlení na 2 desetinná místa
            const vazenyFormatted = vazenyPrumer ? parseFloat(vazenyPrumer.replace(',', '.')).toFixed(2) : '—';
            const finalniFormatted = finalniPrumer ? parseFloat(finalniPrumer.replace(',', '.')).toFixed(2) : '—';
            document.getElementById('weightedAvg').textContent = vazenyFormatted;
            document.getElementById('finalAvg').textContent = finalniFormatted;
            document.getElementById('grade').textContent = znamka || '—';
        }
    </script>
